<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks System</title>
    <link rel="stylesheet" href="marksheet.css">
</head>
<body>

    <div class="container">

        <h1>Student Marks Record</h1>

        <div class="form-box">

            <label>Student Name</label>
            <input type="text" id="name" placeholder="Enter Student Name">

            <label>English</label>
            <input type="number" id="english" placeholder="Enter English Marks">

            <label>Mathematics</label>
            <input type="number" id="maths" placeholder="Enter Mathematics Marks">

            <label>Java Programming</label>
            <input type="number" id="java" placeholder="Enter Java Marks">

            <label>Python Programming</label>
            <input type="number" id="python" placeholder="Enter Python Marks">

            <button onclick="addStudent()">Add Record</button>

            <button onclick="showTopper()">Show Topper</button>

        </div>

        <h2>All Student Records</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>English</th>
                    <th>Maths</th>
                    <th>Java</th>
                    <th>Python</th>
                    <th>Average</th>
                </tr>
            </thead>

            <tbody id="recordTable">
            </tbody>
        </table>

        <h2 id="topper"></h2>

    </div>

    <script src="marksheet.js"></script>

</body>
</html>
