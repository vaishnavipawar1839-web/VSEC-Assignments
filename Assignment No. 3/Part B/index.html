<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Complaint Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Complaint Management</h1>
        <p class="subtitle">Register and manage student complaints</p>

        <div class="summary">
            <div class="card">
                <h3>Total Complaints</h3>
                <p id="total">0</p>
            </div>
            <div class="card">
                <h3>Pending</h3>
                <p id="pending">0</p>
            </div>
            <div class="card">
                <h3>Resolved</h3>
                <p id="resolved">0</p>
            </div>
        </div>

        <div class="form-box">
            <h2>Register Complaint</h2>

            <label>Student Name</label>
            <input type="text" id="name" placeholder="Enter student name">

            <label>Complaint Description</label>
            <textarea id="complaint" placeholder="Enter your complaint"></textarea>

            <button onclick="addComplaint()">Submit Complaint</button>
        </div>

        <h2>Complaint Records</h2>

        <input type="text" id="search"
               placeholder="Search by student name..."
               oninput="displayComplaints()">

        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student Name</th>
                        <th>Complaint</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="complaintTable"></tbody>
            </table>
        </div>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
